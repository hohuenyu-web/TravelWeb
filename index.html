<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JourneyCrafter</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #FAF9F6;
            --primary: #708090;
            --accent: #D4AF37;
            --text-main: #2c3e50;
            --text-light: #95a5a6;
            --card-bg: rgba(255, 255, 255, 0.95);
            --shadow: 0 8px 30px rgba(0,0,0,0.08);
            --nav-height: 70px;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Noto Serif TC', serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 0; height: 100vh; overflow: hidden; position: relative; }
        #sync-status { position: fixed; top: 15px; right: 15px; z-index: 9999; width: 12px; height: 12px; border-radius: 50%; background: #ccc; box-shadow: 0 0 5px rgba(0,0,0,0.2); transition: 0.3s; border: 2px solid white; }
        #sync-status.online { background: #27ae60; } #sync-status.offline { background: #e74c3c; }
        #toast-container { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); z-index: 9999; pointer-events: none; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .toast-msg { background: rgba(44, 62, 80, 0.95); color: white; padding: 10px 20px; border-radius: 30px; font-size: 0.9rem; animation: fadeInOut 3s forwards; max-width: 80%; text-align: center; backdrop-filter: blur(4px); }
        @keyframes fadeInOut { 0% { opacity: 0; transform: translateY(20px); } 10% { opacity: 1; transform: translateY(0); } 90% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-20px); } }
        .input-floating { width: 100%; padding: 15px; border: 1px solid #eee; background: white; border-radius: 12px; font-size: 1rem; outline: none; margin-bottom: 10px; font-family: inherit; }
        .btn-primary { background: var(--primary); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; width: 100%; font-weight: 500; cursor: pointer; transition: 0.3s; font-family: inherit; }
        .btn-primary:disabled { background: #ccc; cursor: not-allowed; }
        .btn-cancel { background: #f0f0f0; color: #666; border: none; padding: 15px; border-radius: 12px; font-size: 1rem; flex: 1; cursor: pointer; font-family: inherit; }
        #home-screen { position: absolute; width: 100%; height: 100%; display: flex; flex-direction: column; background: #FAF9F6; z-index: 100; transition: 0.4s; }
        #home-screen.hidden { transform: translateX(-100%); pointer-events: none; opacity: 0; }
        .home-header { padding: 20px 25px; display: flex; justify-content: space-between; align-items: center; }
        .home-title { font-size: 1.5rem; font-weight: 700; color: #708090; }
        .home-actions { display: flex; gap: 10px; }
        .btn-add-trip, .btn-join-trip { padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; transition: all 0.2s; }
        .btn-add-trip { color: #fff; background: var(--accent); box-shadow: 0 4px 10px rgba(212, 175, 55, 0.3); }
        .btn-add-trip:active { transform: scale(0.95); }
        .btn-join-trip { color: #3498db; background: rgba(52, 152, 219, 0.1); }
        .btn-join-trip:active { background: rgba(52, 152, 219, 0.2); }
        .trip-list-container { flex: 1; overflow-y: auto; padding: 10px 25px 80px 25px; }
        .trip-card-item { background: white; border-radius: 20px; margin-bottom: 25px; box-shadow: var(--shadow); overflow: hidden; position: relative; transition: transform 0.2s; cursor: pointer; }
        .tc-image { height: 160px; background-size: cover; background-position: center; position: relative; }
        .tc-content { padding: 15px 20px; }
        .tc-title { font-size: 1.4rem; font-weight: 700; color: #2c3e50; margin-bottom: 5px; }
        .tc-meta-row { display: flex; justify-content: space-between; font-size: 0.85rem; color: #888; gap: 8px; flex-wrap: wrap; }
        .trip-code-chip { display: inline-flex; align-items: center; gap: 6px; background: #f4f1e8; color: #6b5b2e; border-radius: 999px; padding: 4px 10px; font-size: 0.8rem; font-weight: 700; margin-top: 8px; }
        .trip-code-chip button { border: none; background: transparent; cursor: pointer; color: inherit; padding: 0; }
        .card-tools { position: absolute; top: 15px; right: 15px; display: flex; gap: 8px; z-index: 10; }
        .btn-card-tool { width: 36px; height: 36px; background: rgba(255,255,255,0.95); border-radius: 50%; color: #555; display: flex; align-items: center; justify-content: center; font-size: 1rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: 0.2s; }
        .btn-card-tool:hover { transform: scale(1.1); color: #e74c3c; }
        #create-trip-modal, #add-flight-modal, #add-spot-modal, #join-trip-modal, #add-expense-modal, #add-wallet-modal, #add-split-modal, #add-shopping-modal, #add-info-modal, #settle-up-modal, #confirm-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 2000; display: flex; align-items: flex-end; opacity: 0; pointer-events: none; transition: 0.3s;
        }
        .active { opacity: 1 !important; pointer-events: auto !important; }
        .modal-content { background: #FAF9F6; width: 100%; height: 90vh; border-radius: 25px 25px 0 0; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.3s; }
        .active .modal-content { transform: translateY(0); }
        #join-trip-modal .modal-content, #add-expense-modal .modal-content, #add-wallet-modal .modal-content, #add-split-modal .modal-content, #settle-up-modal .modal-content, #confirm-modal .modal-content { height: auto; min-height: 30vh; }
        .creator-form { flex: 1; overflow-y: auto; padding: 25px; }
        .creator-actions { padding: 20px; background: white; display: flex; gap: 15px; border-top: 1px solid #eee; padding-bottom: max(20px, env(safe-area-inset-bottom)); }
        .upload-btn-wrapper { position: relative; overflow: hidden; display: inline-block; width: 100%; }
        .upload-input { font-size: 100px; position: absolute; left: 0; top: 0; opacity: 0; cursor: pointer; height: 100%; width: 100%; }
        .preview-box { height: 100px; display:none; margin-top:10px; border-radius:10px; background-size:cover; background-position:center; border: 1px solid #ddd; }
        .icon-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; max-height: 150px; overflow-y: auto; padding: 5px; }
        .icon-option { width: 40px; height: 40px; border-radius: 10px; background: #f9f9f9; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid transparent; transition: 0.2s; font-size: 1.2rem; }
        .icon-option.selected { border-color: var(--accent); background: #fffdf5; transform: scale(1.1); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .color-grid { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; }
        .color-option { min-width: 45px; height: 45px; border-radius: 50%; cursor: pointer; border: 3px solid white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: 0.2s; flex-shrink: 0; }
        .color-option.selected { transform: scale(1.15); box-shadow: 0 0 0 3px var(--accent); }
        #main-app { position: absolute; width: 100%; height: 100%; flex-direction: column; background-color: var(--bg-color); z-index: 50; display: none; overflow: hidden; }
        #main-app.active { display: flex; }
        #main-app-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: -2; background-size: cover; background-position: center; filter: blur(1px); transform: scale(1.05); }
        #main-app::before { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.45); z-index: -1; pointer-events: none; backdrop-filter: blur(5px); }
        .app-header { height: 60px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; background: rgba(255,255,255,0.8); backdrop-filter: blur(10px); z-index: 10; gap: 10px; }
        .content-area { flex: 1; overflow-y: auto; padding-bottom: 90px; position: relative; z-index: 1; }
        .tab-content { display: none; height: 100%; }
        .tab-content.active { display: block; }
        .fab-add { position: fixed; bottom: 90px; right: 25px; width: 60px; height: 60px; background: var(--accent); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; box-shadow: 0 5px 20px rgba(0,0,0,0.3); z-index: 90; cursor: pointer; transition: 0.3s; border: 3px solid white; }
        .fab-add:active { transform: scale(0.9); }
        .bottom-nav { height: var(--nav-height); background: rgba(255,255,255,0.95); display: flex; justify-content: space-around; align-items: center; position: fixed; bottom: 0; width: 100%; padding-bottom: env(safe-area-inset-bottom); z-index: 20; box-shadow: 0 -5px 20px rgba(0,0,0,0.03); backdrop-filter: blur(5px); }
        .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; color: #b0bec5; font-size: 0.75rem; width: 14%; height: 100%; cursor: pointer; }
        .nav-item.active { color: var(--primary); transform: translateY(-2px); }
        .day-nav { display: flex; gap: 12px; overflow-x: auto; padding: 15px 20px; }
        .day-chip-square { flex: 0 0 auto; width: 70px; height: 75px; border-radius: 16px; background: var(--card-bg); color: #999; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .day-chip-square.active { border: 2px solid var(--primary); background: rgba(255,255,255,0.9); transform: translateY(-3px); }
        .day-chip-square .d-label { font-size: 0.8rem; font-weight: 700; }
        .day-chip-square .d-date { font-size: 0.7rem; color: #666; }
        .weather-card { background: linear-gradient(135deg, #89f7fe 0%, #66a6ff 100%); border-radius: 20px; padding: 20px; color: white; display: flex; justify-content: space-between; align-items: center; margin: 20px; cursor: pointer; box-shadow: var(--shadow); }
        .weather-left { display: flex; align-items: center; gap: 15px; }
        .weather-temp { font-size: 1.1rem; font-weight: 700; }
        .weather-desc { font-size: 0.85rem; opacity: 0.95; margin-top: 2px; }
        .flight-card-v2 { background: linear-gradient(135deg, #5b7fff 0%, #3366ff 100%); border-radius: 24px; padding: 20px; color: white; margin: 20px; position: relative; box-shadow: var(--shadow); }
        .fc-top { display: flex; justify-content: space-between; margin-bottom: 20px; }
        .fc-tag { background: rgba(255,255,255,0.2); padding: 4px 10px; border-radius: 8px; font-size: 0.75rem; font-weight: 700; letter-spacing: 1px; }
        .fc-time { font-size: 1.5rem; font-weight: 700; letter-spacing: 1px; }
        .fc-code { font-size: 2.2rem; font-weight: 700; line-height: 1; }
        .fc-bottom { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 15px; }
        .fc-info { font-size: 0.9rem; font-weight: 500; }
        .schedule-card { background: var(--card-bg); border-radius: 20px; padding: 15px; margin: 0 20px 15px 20px; display: flex; gap: 15px; position: relative; backdrop-filter: blur(4px); transition: 0.2s; flex-direction: column; }
        .schedule-card:active { transform: scale(0.98); }
        .sc-main { display: flex; gap: 15px; }
        .sc-left { width: 50px; text-align: center; }
        .sc-time { font-weight: 700; font-size: 0.9rem; margin-bottom: 5px; }
        .sc-right { flex: 1; }
        .sc-title { font-weight: 700; font-size: 1.1rem; margin-bottom: 5px; }
        .sc-detail-row { font-size: 0.85rem; color: #666; display: flex; align-items: center; gap: 5px; margin-bottom: 3px; word-break: break-all; }
        .sc-tools { position: absolute; top: 15px; right: 15px; display: flex; gap: 10px; }
        .sc-tool-btn { color: #ccc; cursor: pointer; transition: 0.2s; font-size: 1rem; width: 32px; height: 32px; display:flex; align-items:center; justify-content:center; border-radius: 50%; background: #f5f5f5; }
        .sc-tool-btn:hover { color: #e74c3c; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .sc-details-block { margin-top: 5px; padding-top: 5px; border-top: 1px dashed rgba(0,0,0,0.1); padding-left: 65px; }
        .wallet-list-container { display: flex; gap: 15px; overflow-x: auto; padding: 10px 20px; }
        .wallet-card { flex: 0 0 auto; width: 220px; height: 120px; background: linear-gradient(135deg, #708090 0%, #2c3e50 100%); border-radius: 18px; padding: 15px; color: white; display: flex; flex-direction: column; justify-content: space-between; position: relative; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .wallet-card.wallet-add { background: white; border: 2px dashed #ccc; color: #ccc; align-items: center; justify-content: center; width: 120px; cursor: pointer; }
        .wallet-name { font-size: 1rem; opacity: 0.9; }
        .wallet-balance { font-size: 1.6rem; font-weight: 700; }
        .wallet-tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 5px; }
        .wallet-tool-btn { width: 28px; height: 28px; background: rgba(255,255,255,0.2); border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; cursor: pointer; transition: 0.2s; }
        .split-list { padding: 20px; }
        .split-summary-card { background: linear-gradient(135deg, #FF9966 0%, #FF5E62 100%); border-radius: 20px; padding: 25px; color: white; box-shadow: 0 10px 25px rgba(255, 94, 98, 0.3); margin-bottom: 25px; text-align: center; }
        .split-total-amount { font-size: 2.5rem; font-weight: 700; margin: 10px 0; }
        .split-avg-label { background: rgba(255, 255, 255, 0.2); padding: 5px 15px; border-radius: 20px; font-size: 0.9rem; display: inline-block; }
        .split-members-bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 0 0 16px 0; }
        .split-member-chip { background: white; border: 1px solid #eee; border-radius: 20px; padding: 6px 12px; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
        .split-member-add { background: #f7f4ea; color: var(--primary); border: 1px dashed #d4af37; cursor: pointer; font-family: inherit; }
        .person-balance-table { width: 100%; border-collapse: collapse; margin-top: 6px; font-size: 0.9rem; }
        .person-balance-table th { text-align: left; color: #888; font-weight: 500; padding: 6px 4px; font-size: 0.78rem; }
        .person-balance-table td { padding: 8px 4px; border-top: 1px solid #f0f0f0; vertical-align: middle; }
        .balance-pos { color: #27ae60; font-weight: 700; }
        .balance-neg { color: #e74c3c; font-weight: 700; }
        .balance-zero { color: #888; }
        .participant-list { display: flex; flex-wrap: wrap; gap: 8px; margin: 6px 0 14px; }
        .participant-item { display: flex; align-items: center; gap: 6px; background: #f7f7f7; border-radius: 20px; padding: 6px 12px; font-size: 0.9rem; cursor: pointer; }
        .participant-item input { accent-color: var(--primary); }
        .split-item { background: var(--card-bg); border-radius: 16px; padding: 15px 20px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .split-item-left h4 { margin: 0; font-size: 1rem; color: #333; }
        .split-item-left span { font-size: 0.8rem; color: #888; display: flex; align-items: center; gap: 5px; margin-top: 3px; }
        .split-item-amount { font-weight: 700; font-size: 1.1rem; color: var(--primary); }
        .settlement-card { background: white; border-radius: 16px; padding: 20px; margin-top: 20px; border: 1px solid #eee; }
        .debt-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px dashed #eee; }
        .debt-row:last-child { border-bottom: none; margin-bottom: 0; padding-bottom: 0; }
        .debt-visual { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; color: #888; font-size: 0.9rem; }
        .debt-arrow { color: #e74c3c; font-size: 1.2rem; }
        .debt-amount { background: #e74c3c; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.9rem; font-weight: 700; }
        .user-avatar { width: 32px; height: 32px; border-radius: 50%; color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; }
        .debt-user-block { display: flex; flex-direction: column; align-items: center; width: 60px; }
        .debt-user-name { font-size: 0.8rem; margin-top: 4px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .expense-item, .shopping-card, .info-card { background: var(--card-bg); border-radius: 16px; padding: 15px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(4px); }
        .item-actions { display: flex; gap: 10px; }
        .action-btn { color: #888; cursor: pointer; width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #f0f0f0; transition: 0.2s; }
        .action-btn:hover { background: white; box-shadow: 0 2px 5px rgba(0,0,0,0.1); color: var(--primary); }
        .action-btn.delete:hover { color: #e74c3c; }
        .shopping-card { background: var(--card-bg); border-radius: 16px; overflow: hidden; display: flex; margin-bottom: 15px; backdrop-filter: blur(4px); position: relative; padding:0; }
        .shop-img { width: 100px; height: 100px; background: #eee; background-size: cover; background-position: center; }
        .shop-content { padding: 15px; flex: 1; }
        .info-card { background: var(--card-bg); border-radius: 16px; margin-bottom: 15px; overflow: hidden; backdrop-filter: blur(4px); display:block; padding:0; }
        .info-header { padding: 15px; background: rgba(0,0,0,0.03); font-weight: 700; display: flex; justify-content: space-between; align-items: center; }
        .info-img-box { width: 100%; height: 150px; background-size: cover; background-position: center; }
        .info-body { padding: 15px; white-space: pre-wrap; font-size: 0.9rem; }
        .btn-section-add { background: white; border: 1px solid #eee; color: var(--primary); padding: 10px 20px; border-radius: 25px; font-size: 0.9rem; cursor: pointer; font-weight: 600; display: flex; align-items: center; gap: 8px; transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); font-family: inherit; }
        .pre-trip-section { background: var(--card-bg); border-radius: 16px; padding: 15px; margin: 15px; backdrop-filter: blur(4px); }
        .pre-trip-header { display: flex; justify-content: space-between; align-items: center; font-weight: 700; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
        .checklist-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #f8f9fa; border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
        .checklist-item i { color: #dc3545; cursor: pointer; padding: 5px; }
        .empty-state { text-align: center; color: #999; padding: 40px; font-style: italic; }
        .backup-section { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .btn-backup, .btn-restore { padding: 12px; border-radius: 8px; border: none; background: var(--primary); color: white; cursor: pointer; font-family: inherit; }
        .date-row { display: flex; gap: 10px; }
        .date-row input, .date-row select { flex: 1; }
        .form-section { margin-bottom: 20px; }
        .section-title { font-weight: 600; margin-bottom: 8px; color: var(--text-main); }
        .btn-upload { width: 100%; padding: 12px; background: #f8f9fa; border: 1px dashed #ddd; border-radius: 8px; color: #666; cursor: pointer; font-family: inherit; }
        .modal-header { margin-bottom: 20px; }
        .modal-header h2 { margin: 0; color: var(--text-main); }
        #map { height: 100%; width: 100%; }
        #chart-container { width: 80%; margin: 0 auto 20px auto; max-height: 250px; }
        .custom-map-marker { background-color: var(--accent); color: white; border-radius: 50%; width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border: 2px solid white; font-weight: bold; box-shadow: 0 2px 5px rgba(0,0,0,0.3); font-size: 0.9rem; }
        .header-code { font-size: 0.75rem; color: #888; font-weight: 500; }
    </style>
</head>
<body>

    <div id="sync-status" class="offline" title="同步狀態"></div>
    <div id="toast-container"></div>

    <div id="home-screen">
        <div class="home-header">
            <div class="home-title"><i class="fas fa-suitcase-rolling"></i> 我的旅行</div>
            <div class="home-actions">
                <div class="btn-join-trip" onclick="window.app.openJoinModal()"><i class="fas fa-user-plus"></i> 加入</div>
                <div class="btn-add-trip" onclick="window.app.openCreateModal()"><i class="fas fa-plus"></i> 新增</div>
            </div>
        </div>
        <div class="trip-list-container" id="trip-list"></div>
    </div>

    <div id="create-trip-modal">
        <div class="modal-content">
            <div class="creator-form">
                <div class="modal-header"><h2>規劃新旅程</h2></div>
                <div class="form-section">
                    <div class="section-title">旅行編號（選填，之後用呢個編號登入睇返行程）</div>
                    <input type="text" id="input-custom-id" class="input-floating" placeholder="例如：JAPAN26（留空會自動產生）">
                </div>
                <div class="form-section">
                    <div class="section-title">標題</div>
                    <input type="text" id="input-title" class="input-floating" placeholder="例如：日本京都">
                </div>
                <div class="form-section">
                    <div class="section-title">目的地（選填，用於自動連結天氣）</div>
                    <input type="text" id="input-destination" class="input-floating" placeholder="例如：曼谷 / Bangkok">
                </div>
                <div class="date-row">
                    <input type="date" id="input-start" class="input-floating">
                    <input type="date" id="input-end" class="input-floating">

    function generateTripId() {
        const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';

    }

    const weatherCache = { geo: {}, forecast: {} };

    function parseLocalDate(value) {
        if (!value) return null;
        if (value instanceof Date && !isNaN(value)) {
            return new Date(value.getFullYear(), value.getMonth(), value.getDate());
        }
        const s = String(value).trim();
        const m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
        if (m) return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]));
        const d = new Date(s);
        if (isNaN(d)) return null;
        return new Date(d.getFullYear(), d.getMonth(), d.getDate());
    }

    function addDaysLocal(date, days) {
        const d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
        d.setDate(d.getDate() + days);
        return d;
    }

    function formatYMD(d) {
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, '0');
        const day = String(d.getDate()).padStart(2, '0');
        return `${y}-${m}-${day}`;
    }

    function formatChineseDate(d) {
        return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日`;
    }

    function getTripDayDate(trip, idx) {
        const start = parseLocalDate(trip && trip.start);
        if (!start) return null;
        return addDaysLocal(start, Number(idx) || 0);
    }

    function inferCityFromTitle(title) {
        if (!title) return '';
        let t = String(title);
        t = t.replace(/\d{4}[\/.\-年]\d{1,2}[\/.\-月]\d{1,2}日?/g, ' ');
        t = t.replace(/\d{4}\s*年/g, ' ');
        t = t.replace(/旅遊|旅行|自由行|行程|假期|度假|之旅|遊記|觀光|親子遊|自駕遊|跟團|蜜月|vacation|holiday|travel|tour|trip/gi, ' ');
        t = t.replace(/[（(].*?[）)]/g, ' ').replace(/[-_~～、，。！!？?]/g, ' ').replace(/\s+/g, ' ').trim();
        return t;
    }

    function getDayDestination(trip, idx) {
        if (!trip) return '目的地';
        const dest = String(trip.destination || '').trim();
        if (dest) return dest;
        const flights = (trip.flights || []).filter(f => f.dayIndex === idx);
        if (flights.length) {
            const lastDay = Math.max((trip.days || 1) - 1, 0);
            if (idx === lastDay && lastDay !== 0) {
                const from = String(flights[0].from || '').trim();
                if (from) return from;
            }
            const to = String(flights[0].to || '').trim();
            if (to) return to;
            const from = String(flights[0].from || '').trim();
            if (from) return from;
        }
        return inferCityFromTitle(trip.title) || trip.title || '目的地';
    }

        if (c >= 71 && c <= 77) return '下雪';
        if (c >= 80 && c <= 82) return '陣雨';
        if (c === 85 || c === 86) return '陣雪';
        if (c >= 95) return '雷暴';
        return '天氣資訊';
    }

    async function fetchWeatherForDay(city, ymd) {
        try {
            const geoKey = String(city || '').trim().toLowerCase();
            if (!geoKey || !ymd) return null;
            let geo = weatherCache.geo[geoKey];
            if (!geo) {
                const res = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=zh`);
                if (!res.ok) return null;
                const data = await res.json();
                const r = data.results && data.results[0];
                if (!r) return null;
                geo = { lat: r.latitude, lon: r.longitude, name: r.name };
                weatherCache.geo[geoKey] = geo;
            }
            const fKey = `${geo.lat},${geo.lon},${ymd}`;
            if (weatherCache.forecast[fKey]) return weatherCache.forecast[fKey];
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${geo.lat}&longitude=${geo.lon}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&start_date=${ymd}&end_date=${ymd}`;
            const res = await fetch(url);
            if (!res.ok) return null;
            const data = await res.json();
            const daily = data.daily;
            if (!daily || !Array.isArray(daily.time) || daily.time[0] !== ymd) return null;
            if (daily.temperature_2m_max[0] == null || daily.temperature_2m_min[0] == null) return null;
            const result = {
                max: daily.temperature_2m_max[0],
                min: daily.temperature_2m_min[0],
                hint: weatherHint(daily.weather_code[0])
            };
            weatherCache.forecast[fKey] = result;
            return result;
        } catch (e) {
            return null;
        }
    }

    function getSplitMembers(trip) {

        (trip.splitMembers || []).forEach(add);

    function getItemParticipants(item, members, payers) {
        if (Array.isArray(item.participants) && item.participants.length) {
            return item.participants.map(n => String(n).trim()).filter(Boolean);
        }
        if (members && members.length) return members.slice();
        return (payers || []).slice();
    }

    function calcSplitSettlement(trip) {
        const items = trip.splitItems || [];
        const members = getSplitMembers(trip);
        const payers = [...new Set(items.map(i => String(i.payer || '').trim()).filter(Boolean))];
        const paid = {}, owed = {};
        const ensure = (n) => { if (!(n in paid)) paid[n] = 0; if (!(n in owed)) owed[n] = 0; };
        members.forEach(ensure);
        items.forEach(i => {
            const amount = parseFloat(i.amount) || 0;
            const payer = String(i.payer || '').trim();
            const parts = getItemParticipants(i, members, payers);
            if (payer) { ensure(payer); paid[payer] += amount; }
            const count = parts.length;
            if (!count) return;
            const share = amount / count;
            parts.forEach(p => { ensure(p); owed[p] += share; });
        });
        const people = Object.keys(paid);
        const balances = people.map(n => ({ n, paid: paid[n], owed: owed[n], bal: paid[n] - owed[n] }));
        const debtors = balances.filter(b => b.bal < -0.5).map(b => ({ n: b.n, v: -b.bal }));
        const creditors = balances.filter(b => b.bal > 0.5).map(b => ({ n: b.n, v: b.bal }));
        const transfers = [];
        let i = 0, j = 0;
        while (i < debtors.length && j < creditors.length) {
            const m = Math.min(debtors[i].v, creditors[j].v);
            transfers.push({ from: debtors[i].n, to: creditors[j].n, amount: m });
            debtors[i].v -= m;
            creditors[j].v -= m;
            if (debtors[i].v < 0.5) i++;
            if (creditors[j].v < 0.5) j++;
        }
        const total = items.reduce((a, it) => a + (parseFloat(it.amount) || 0), 0);
        return { members, balances, transfers, total, payers };
    }

    async function geocodeAddress(query) {
        if (!query) return null;
        let cleanQuery = query
            .replace(/[\{\}\[\]]/g, ' ')
            .replace(/\s+\d+F($|\s)/gi, ' ')
            .replace(/\s+B\d+($|\s)/gi, ' ')
            .replace(/\s+\d+階($|\s)/g, ' ')
            .replace(/\s+\d+樓\s*/g, '')
            .replace(/[−－]/g, '-')
            .trim()
            .replace(/,/g, ' ');
        const searchCandidates = [cleanQuery];
        if (/〒|\d{3}-\d{4}/.test(cleanQuery)) {
            searchCandidates.push(cleanQuery.replace(/〒?\s*\d{3}[-]?\d{4}/g, '').trim());
        }
        if (/Japan/i.test(cleanQuery)) {
            searchCandidates.push(cleanQuery.replace(/Japan/ig, '').trim());
        }
        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 10000);
        try {
            for (const q of searchCandidates) {
                if (!q) continue;
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`;
                const response = await fetch(url, { signal: controller.signal, headers: { 'Accept': 'application/json' } });
                if (!response.ok) continue;
                const data = await response.json();
                if (data && data.length > 0) {
                    clearTimeout(timeoutId);
                    return { lat: parseFloat(data[0].lat), lng: parseFloat(data[0].lon) };
                }
            }
        } catch (e) {
            console.warn("Geocoding skipped/failed:", e);
        } finally {
             clearTimeout(timeoutId);
        }
        return null;
    }

        upsertLocalTrip: (t) => {
            const did = tripDocId(t);
            const idx = myTrips.findIndex(x => tripDocId(x)===did || x.id===t.id);
            if (idx>-1) myTrips[idx]=t; else myTrips.unshift(t);
            try { localStorage.setItem('trips', JSON.stringify(myTrips)); } catch(e) { console.warn(e); }
            const cidx = allCache.findIndex(x => tripDocId(x)===did);
            if (cidx>-1) allCache[cidx]=t; else if (did) allCache.push(t);
        },

        saveTrip: async (t) => {
            const did = tripDocId(t);
            if (did) t.docId = did;
            app.upsertLocalTrip(t);
            if(isReady && did) {
                const payload = {...t};
                await setDoc(doc(db, 'trips', did), payload, { merge: true });
            }
            if(currentTrip && (tripDocId(currentTrip)===did || currentTrip.id===t.id)) {
                currentTrip=t;
                app.refreshView();
            }
            app.renderTripList();
        },

        submitTripForm: async () => {
            const title=document.getElementById('input-title').value.trim();
            const start=document.getElementById('input-start').value;
            const end=document.getElementById('input-end').value;
            if(!title||!start||!end) return alert("請填寫完整");
            const btn = document.getElementById('btn-save-trip');
            btn.innerText = "處理中...";
            btn.disabled = true;
            const days = Math.ceil((new Date(end)-new Date(start))/86400000)+1;
            let cur = defaultCurrency;
            for(let k in currencyMap) if(title.includes(k)) cur=currencyMap[k];

            try {
                if(editId) {
                    let t = app.getTripById(editId);
                    if(t) {
                        Object.assign(t, {
                            title, start, end, days:days>0?days:1,
                            destination: document.getElementById('input-destination').value.trim(),
                            desc:document.getElementById('input-desc').value,
                            cover:temp.cover||t.cover, bg:temp.bg||t.bg,
                            themeColor:temp.color||t.themeColor, icon:temp.icon||t.icon
                        });
                        await app.saveTrip(t);
                        app.closeCreateModal();
                        showToast('已儲存');
                    }
                } else {
                    let cid=normalizeId(document.getElementById('input-custom-id').value).replace(/\s+/g,'');
                    if (!cid) {
                        for (let n=0;n<8;n++) {
                            cid = generateTripId();
                            if (isReady) {
                                const existing = await getDoc(doc(db, 'trips', cid));
                                if (!existing.exists()) break;
                            } else if (!app.getTripById(cid)) break;
                        }
                    } else if (isReady) {
                        const existingDoc = await getDoc(doc(db, 'trips', cid));
                        if(existingDoc.exists()) {
                            alert("此編號已存在，請更換一個");
                            return;
                        }
                    } else if (app.getTripById(cid)) {
                        alert("此編號已存在，請更換一個");
                        return;
                    }

                    const newT = {
                        id:Date.now(), title, start, end, days:days>0?days:1,
                        destination: document.getElementById('input-destination').value.trim(),
                        cover:temp.cover||'', bg:temp.bg||'',
                        themeColor:temp.color||'#708090', icon:temp.icon||'✈️', currency:cur,
                        flights:[], spots:[], shoppingList:[], expenses:[], wallets:[], splitItems:[], splitMembers: [], infoCards:[], checklists: [],
                        docId: cid, customId: cid
                    };
                    rememberId(cid);
                    if(isReady) {
                        await setDoc(doc(db, 'trips', cid), newT);
                        app.watchTrip(cid);
                    }
                    app.upsertLocalTrip(newT);
                    app.closeCreateModal();
                    await app.copyTripId(cid);
                    showToast('已建立，旅行編號：' + cid);
                    app.openApp(newT);
                }
            } catch(e) {
                console.error(e);
                alert("儲存失敗，已先保存在此裝置。\n" + (e.message||e));
                isReady = false;
                document.getElementById('sync-status').className='offline';
            } finally {
                btn.innerText = editId ? "儲存" : "建立";
                btn.disabled = false;
                app.renderTripList();
            }
        },

        joinTrip: async () => {
            const id = normalizeId(document.getElementById('input-join-id').value);
            if (!id) return alert('請輸入旅行編號');
            const btn = document.querySelector('#join-trip-modal .btn-primary');
            const old = btn.innerText;
            btn.innerText = '載入中...';
            btn.disabled = true;
            try {
                let t = null;
                if (isReady) {
                    const snap = await getDoc(doc(db, 'trips', id));
                    if (snap.exists()) t = { ...snap.data(), docId: id, customId: id };
                }
                if (!t) t = app.getTripById(id);
                if (!t) {
                    alert('找不到此編號。請確認編號無誤，或檢查網絡後再試。');
                    return;
                }
                rememberId(id);
                app.upsertLocalTrip(t);
                if (isReady) app.watchTrip(id);
                app.closeJoinModal();
                document.getElementById('input-join-id').value = '';
                showToast('已載入行程：' + (t.title||id));
                app.renderTripList();
                app.openApp(t);
            } catch (e) {
                console.error(e);
                alert('加入失敗：' + (e.message||e));
            } finally {
                btn.innerText = old;
                btn.disabled = false;
            }
        },

        watchTrip: (id) => {
            const did = normalizeId(id);
            if (!isReady || !did || tripUnsubs.has(did)) return;
            const unsub = onSnapshot(doc(db, 'trips', did), (snap) => {
                if (!snap.exists()) return;
                const t = { ...snap.data(), docId: did, customId: did };
                app.upsertLocalTrip(t);
                if (currentTrip && tripDocId(currentTrip)===did) {
                    currentTrip = t;
                    app.refreshView();
                }
                app.renderTripList();
            }, (err) => console.warn('watch failed', did, err));
            tripUnsubs.set(did, unsub);
        },

        watchAllKnown: () => {
            subIds.forEach(id => app.watchTrip(id));
        },

            const target = normalizeId(id);
            return allCache.find(x => tripDocId(x)===target) || myTrips.find(x => tripDocId(x)===target || String(x.id)===target);
        },

        saveSpot: async () => {
            const title=document.getElementById('spot-title').value;
            if(!title) return;
            const btn = document.getElementById('btn-save-spot');
            const originalText = btn.innerText;
            btn.innerText = "處理中...";
            btn.disabled = true;
            try {
                const idVal=document.getElementById('spot-id').value;
                const address = document.getElementById('spot-address').value;
                let coords = {};
                if(address) {
                    const geo = await geocodeAddress(address);
                    if(geo) coords = geo;
                }
                if(!coords.lat && title) {
                     const geoTitle = await geocodeAddress(title);
                     if(geoTitle) coords = geoTitle;
                }
                const spot = {
                    id: idVal?parseInt(idVal):Date.now(),
                    dayIndex: Math.max(dayIdx, 0),
                    time:document.getElementById('spot-time').value,
                    title,
                    icon:document.getElementById('spot-icon').value,
                    address,
                    phone:document.getElementById('spot-phone').value,
                    link:document.getElementById('spot-link').value,
                    web:document.getElementById('spot-web').value,
                    ...coords
                };
                if(!currentTrip.spots) currentTrip.spots=[];
                if(idVal) {
                    const i=currentTrip.spots.findIndex(x=>x.id==idVal);
                    if(i>-1) currentTrip.spots[i]=spot;
                } else currentTrip.spots.push(spot);
                currentTrip.spots.sort((a,b)=>String(a.time||'').localeCompare(String(b.time||'')));
                await app.saveTrip(currentTrip);
                if (coords.lat && window.journeyMap) {
                    app.initMap();
                    window.journeyMap.flyTo([coords.lat, coords.lng], 16);
                }
                app.closeSpotModal();
            } catch (error) {
                console.error("Save failed:", error);
                alert("儲存失敗，請稍後再試。");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        },

        saveSplitItem: () => {
            const id=document.getElementById('split-id').value;
            const amt=parseFloat(document.getElementById('split-amount').value);
            if(isNaN(amt)) return;
            const payer = document.getElementById('split-payer').value.trim();
            if(!payer) return alert("請填寫付款人");
            let participants = [...document.querySelectorAll('#split-participants input[type=checkbox]:checked')].map(el => el.value.trim()).filter(Boolean);
            if (!participants.length) {
                participants = getSplitMembers(currentTrip);
                if (!participants.length) participants = [payer];
            }
            const item = { id: id?parseInt(id):Date.now(), name:document.getElementById('split-name').value, payer, amount:amt, participants };
            if(!currentTrip.splitItems) currentTrip.splitItems=[];
            if(id) {
                const i=currentTrip.splitItems.findIndex(x=>x.id==id);
                if(i>-1) currentTrip.splitItems[i]=item;
            } else currentTrip.splitItems.push(item);
            const members = getSplitMembers(currentTrip);
            if (!members.includes(payer)) members.push(payer);
            participants.forEach(p => { if (!members.includes(p)) members.push(p); });
            currentTrip.splitMembers = members;
            app.saveTrip(currentTrip);
            app.closeSplitModal();
        },

        saveMemo: () => { currentTrip.memo = document.getElementById('info-memo').value; app.saveTrip(currentTrip); },
        addChecklistItem: (i) => { const t=prompt("輸入檢查項目"); if(t){ if(!currentTrip.checklists[i].items) currentTrip.checklists[i].items = []; currentTrip.checklists[i].items.push(t); app.saveTrip(currentTrip); app.refreshView(); } },
        editChecklistItem: (i, j) => { const oldVal = currentTrip.checklists[i].items[j]; const newVal = prompt("編輯項目", oldVal); if (newVal !== null && newVal.trim() !== "") { currentTrip.checklists[i].items[j] = newVal; app.saveTrip(currentTrip); app.refreshView(); } },
        deleteChecklistItem: (e,i,j) => { e.stopPropagation(); app.openConfirmModal("確定刪除此檢查項目?", () => { currentTrip.checklists[i].items.splice(j,1); app.saveTrip(currentTrip); app.refreshView(); }); },
        addNewChecklist: () => { const t=prompt("輸入清單名稱"); if(t){ if(!currentTrip.checklists) currentTrip.checklists=[]; currentTrip.checklists.push({title:t,items:[]}); app.saveTrip(currentTrip); app.refreshView(); } },
        saveFlight: () => {
            const from=document.getElementById('flight-from').value; if(!from) return;
            if(!currentTrip.flights) currentTrip.flights=[];
            currentTrip.flights.push({ id:Date.now(), dayIndex: Math.max(dayIdx,0), from, to:document.getElementById('flight-to').value, no:document.getElementById('flight-no').value, dep:document.getElementById('flight-dep-time').value, arr:document.getElementById('flight-arr-time').value });
            app.saveTrip(currentTrip); app.closeFlightModal();
        },
        deleteTrip: (e, id) => {
            e.stopPropagation();
            const t = app.getTripById(id);
            if(!t) return;
            app.openConfirmModal("確定移除此旅行？（只係喺呢部裝置隱藏，雲端資料會保留，之後可用編號再加入）", () => {
                const did = tripDocId(t) || String(t.id);
                forgetId(did);
                myTrips = myTrips.filter(x => tripDocId(x) !== did && String(x.id) !== String(t.id));
                allCache = allCache.filter(x => tripDocId(x) !== did);
                try { localStorage.setItem('trips', JSON.stringify(myTrips)); } catch(err){}
                app.renderTripList();
            });
        },
        openEditTripModal: (e, id) => {
            e.stopPropagation();
            const t = app.getTripById(id);
            if(!t) return;
            editId = tripDocId(t) || t.id;
            document.querySelector('#create-trip-modal h2').innerText="編輯旅程";
            document.getElementById('btn-save-trip').innerText="儲存";
            document.getElementById('btn-save-trip').disabled=false;
            document.getElementById('input-custom-id').value = tripDocId(t);
            document.getElementById('input-custom-id').disabled = true;
            document.getElementById('input-title').value=t.title;
            document.getElementById('input-destination').value=t.destination || '';
            document.getElementById('input-start').value=t.start;
            document.getElementById('input-end').value=t.end;
            document.getElementById('input-desc').value=t.desc || '';
            temp.icon = t.icon; temp.color = t.themeColor; temp.cover = t.cover; temp.bg = t.bg;
            if (t.cover) { document.getElementById('cover-preview').style.backgroundImage=`url('${t.cover}')`; document.getElementById('cover-preview').style.display='block'; }
            if (t.bg) { document.getElementById('bg-preview').style.backgroundImage=`url('${t.bg}')`; document.getElementById('bg-preview').style.display='block'; }
            app.initUI();
            document.getElementById('create-trip-modal').classList.add('active');
        },
        handleImageUpload: (input, type) => {
            if(input.files[0]) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const res = e.target.result;
                    if(type==='cover') temp.cover=res;
                    else if(type==='bg') temp.bg=res;
                    else if(type==='shop') temp.shop=res;
                    else if(type==='info') temp.info=res;
                    const prev = document.getElementById(type==='bg'?'bg-preview':(type==='cover'?'cover-preview':(type==='shop'?'shop-preview':'info-preview')));
                    if(prev) { prev.style.backgroundImage=`url('${res}')`; prev.style.display='block'; }
                };
                reader.readAsDataURL(input.files[0]);
            }
        },
        resetImg: (type) => {
            if(type==='shop'){ temp.shop=''; document.getElementById('shop-preview').style.display='none'; }
            else if(type==='info'){ temp.info=''; document.getElementById('info-preview').style.display='none'; }
        },
        initUI: () => {
            const c1=document.getElementById('icon-selector'); c1.innerHTML="";
            emojiList.forEach(e=>{ const d=document.createElement('div'); d.className='icon-option'; if(e === temp.icon) d.classList.add('selected'); d.innerText=e; d.onclick=function() { temp.icon=e; document.querySelectorAll('.icon-option').forEach(el=>el.classList.remove('selected')); this.classList.add('selected'); }; c1.appendChild(d); });
            const c2=document.getElementById('color-selector'); c2.innerHTML="";
            colorPalette.forEach(c=>{ const d=document.createElement('div'); d.className='color-option'; if(c.c === temp.color) d.classList.add('selected'); d.style.backgroundColor=c.c; d.onclick=function() { temp.color=c.c; document.querySelectorAll('.color-option').forEach(el=>el.classList.remove('selected')); this.classList.add('selected'); }; c2.appendChild(d); });
            const amt=document.getElementById('expense-amount');
            if(amt && !amt._bound) {
                amt._bound = true;
                amt.addEventListener('input', function(){ if(currentRate && this.value) { const hkd = (parseFloat(this.value) * currentRate).toFixed(1); document.getElementById('expense-hkd-hint').innerText=`約 HK$ ${hkd}`; } });
            }
        },
        openApp: (trip) => {
            currentTrip = trip; dayIdx=0;
            const home = document.getElementById('home-screen');
            home.classList.add('hidden');
            document.getElementById('main-app').classList.add('active');
            document.documentElement.style.setProperty('--primary', trip.themeColor||'#708090');
            document.documentElement.style.setProperty('--accent', trip.themeColor||'#D4AF37');
            document.getElementById('app-title-display').innerHTML = '<span style="margin-right:8px;">' + (trip.icon||'') + '</span>' + escapeHtml(trip.title||'');
            const code = tripDocId(trip);
            document.getElementById('app-code-display').innerHTML = code ? `編號 ${escapeHtml(code)} <i class="fas fa-copy" style="cursor:pointer" onclick="window.app.copyTripId('${escapeHtml(code)}')"></i>` : '';
            const bg = document.getElementById('main-app-bg');
            if(trip.bg) { bg.style.backgroundImage=`url('${trip.bg}')`; document.getElementById('main-app').style.backgroundColor='transparent'; }
            else { bg.style.backgroundImage='none'; document.getElementById('main-app').style.backgroundColor=(trip.themeColor||'#708090')+'10'; }
            app.refreshView();
            setTimeout(() => { app.initMap(); if(window.journeyMap) window.journeyMap.invalidateSize(); }, 200);
        },
        refreshView: () => {
            const activeNav = document.querySelector('.nav-item.active');
            if(!activeNav) return;
            const tab = activeNav.getAttribute('onclick').match(/'([^']+)'/)[1];
            if(tab==='itinerary') { renderDayNav(); if(dayIdx===-1) renderPreTrip(); else renderDayItinerary(dayIdx); }
            else if(tab==='shopping') renderShoppingList();
            else if(tab==='budget') renderBudget();
            else if(tab==='split') renderSplitBill();
            else if(tab==='food') renderFoodList();
            else if(tab==='info') renderInfoTab();
        },
        renderTripList: () => {
            const c=document.getElementById('trip-list');
            if (!c) return;
            const byId = new Map();
            [...allCache, ...myTrips].forEach(t => {
                const id = tripDocId(t) || String(t.id);
                if (!subIds.length || subIds.includes(id) || myTrips.some(x => x===t || tripDocId(x)===id)) {
                    if (!byId.has(id)) byId.set(id, t);
                }
            });
            let trips = [...byId.values()];
            if (subIds.length) {
                const preferred = trips.filter(t => subIds.includes(tripDocId(t)));
                if (preferred.length) trips = preferred;
            }
            if(trips.length === 0) {
                c.innerHTML = `<div style="text-align:center; padding:40px; color:#999;"><i class="fas fa-suitcase-rolling" style="font-size:3rem; margin-bottom:20px;"></i><p>還沒有任何旅行計劃</p><p>按右上角「新增」開始規劃，或按「加入」輸入旅行編號睇返行程</p></div>`;
                return;
            }
            c.innerHTML = "";
            trips.forEach((t) => {
                const bgStyle = t.cover ? `background-image:url('${t.cover}')` : `background:linear-gradient(135deg, ${t.themeColor||'#708090'} 0%, #2c3e50 100%)`;
                const idParam = tripDocId(t) || String(t.id);
                c.innerHTML += `<div class="trip-card-item" onclick="window.app.loadTrip('${escapeHtml(idParam)}')"><div class="tc-image" style="${bgStyle}"><div class="card-tools"><div class="btn-card-tool" onclick="event.stopPropagation(); window.app.openEditTripModal(event, '${escapeHtml(idParam)}')"><i class="fas fa-edit"></i></div><div class="btn-card-tool" onclick="event.stopPropagation(); window.app.deleteTrip(event, '${escapeHtml(idParam)}')"><i class="fas fa-trash"></i></div></div></div><div class="tc-content"><div class="tc-title">${t.icon || ''} ${escapeHtml(t.title||'')}</div><div class="tc-meta-row"><span><i class="far fa-calendar"></i> ${escapeHtml(t.start||'')} ~ ${escapeHtml(t.end||'')}</span><span><i class="far fa-clock"></i> ${t.days||1}天</span></div><div class="trip-code-chip" onclick="window.app.copyTripId('${escapeHtml(idParam)}', event)"><i class="fas fa-key"></i> 編號 ${escapeHtml(idParam)} <button type="button" aria-label="複製"><i class="fas fa-copy"></i></button></div></div></div>`;
            });
        },
        filterTrips: () => app.renderTripList(),
        initMap: () => {
            const mapEl = document.getElementById('map');
            if(mapEl && !window.journeyMap) {
                mapEl.style.height = '100%';
                window.journeyMap = L.map('map').setView([35.68, 139.76], 5);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap contributors' }).addTo(window.journeyMap);
            }
            if (window.journeyMap) {
                if (markersLayer) { markersLayer.clearLayers(); } else { markersLayer = L.layerGroup().addTo(window.journeyMap); }
                if(currentTrip && currentTrip.spots) {
                    const bounds = [];
                    currentTrip.spots.forEach(spot => {
                        if(spot.lat && spot.lng) {
                            const dayNum = (spot.dayIndex||0) + 1;
                            const customIcon = L.divIcon({ className: 'custom-div-icon', html: `<div class="custom-map-marker">${dayNum}</div>`, iconSize: [30, 30], iconAnchor: [15, 15] });
                            const marker = L.marker([spot.lat, spot.lng], {icon: customIcon}).bindPopup(`<div style="text-align:center;"><b>${escapeHtml(spot.title||'')}</b><br><span style="font-size:0.8rem;color:#666;">Day ${dayNum} - ${escapeHtml(spot.time||'')}</span><br>${escapeHtml(spot.address || '')}</div>`);
                            markersLayer.addLayer(marker);
                            bounds.push([spot.lat, spot.lng]);
                        }
                    });
                    if(bounds.length > 0) window.journeyMap.fitBounds(bounds, {padding: [50, 50], maxZoom: 15});
                }
                window.journeyMap.invalidateSize();
            }
        },
        closeSettlementModal: () => document.getElementById('settle-up-modal').classList.remove('active'),
        openSettlementModal: () => {
            renderSplitBill();
            const dest = document.getElementById('settlement-results');
            dest.innerHTML = document.getElementById('split-summary-area').innerHTML;
            document.getElementById('settle-up-modal').classList.add('active');
        },
        exportData: () => {
            if (!currentTrip) return;
            const payload = JSON.stringify({ docId: tripDocId(currentTrip), trip: currentTrip });
            document.getElementById('import-area').value = payload;
            app.copyTripId(tripDocId(currentTrip) || '');
            showToast('已產生備份代碼');
        },
        importData: async () => {
            const raw = document.getElementById('import-area').value.trim();
            if (!raw) return alert('請貼上備份代碼');
            try {
                const data = JSON.parse(raw);
                const trip = data.trip || data;
                const did = normalizeId(data.docId || trip.docId || trip.customId) || generateTripId();
                trip.docId = did; trip.customId = did;
                rememberId(did);
                await app.saveTrip(trip);
                showToast('已還原，編號：' + did);
                app.openApp(trip);
            } catch (e) {
                alert('還原失敗，請檢查代碼');
            }
        }
    };

    window.app = app;

    (async function() {
        try { myTrips = JSON.parse(localStorage.getItem('trips'))||[]; } catch(err){ myTrips=[]; }
        app.initUI();
        app.renderTripList();

        try {
            const appInit = initializeApp(firebaseConfig);
            auth = getAuth(appInit);
            db = getFirestore(appInit);
            await signInAnonymously(auth);
            onAuthStateChanged(auth, async (u) => {
                if(u) {
                    isReady=true;
                    document.getElementById('sync-status').className='online';
                    for (const id of subIds) {
                        try {
                            const snap = await getDoc(doc(db, 'trips', id));
                            if (snap.exists()) app.upsertLocalTrip({ ...snap.data(), docId: id, customId: id });
                        } catch (e) { console.warn(e); }
                    }
                    app.watchAllKnown();
                    app.renderTripList();
                    if (currentTrip && tripDocId(currentTrip)) {
                        const t = app.getTripById(tripDocId(currentTrip));
                        if (t) { currentTrip = t; app.refreshView(); }
                    }
                }
            });
        } catch(e) {
            isReady=false;
            document.getElementById('sync-status').className='offline';
            app.renderTripList();
            showToast('離線模式：資料先存在此裝置');
        }

        document.getElementById('input-join-id').addEventListener('keydown', (ev) => {
            if (ev.key === 'Enter') app.joinTrip();
        });
        document.addEventListener('visibilitychange', () => { if(!document.hidden) app.refreshView(); });
    })();
</script>
</body>
</html>
